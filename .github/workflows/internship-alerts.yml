name: Internship story alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: internship-story-alerts
  cancel-in-progress: false

jobs:
  check-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check zero2sudo Stories and email new opportunities
        env:
          TARGET_USERNAME: zero2sudo
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: python main.py

      - name: Save processed Story IDs
        if: success()
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change."
            exit 0
          fi

          git config user.name "internship-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update processed zero2sudo stories"
          git pull --rebase
          git push
